# What `scripts/rebrand.py` renames: upstream's Godot Engine becomes Orbe, in file contents and in
# paths. `scripts/rebrand.py check` fails a pull request when a renamed name comes back by hand.
#
# Replacements are literal and case-sensitive, applied in order: put the longer, more specific
# ones first.
#
# What stays upstream's on purpose, because projects, add-ons and extensions made for Godot keep
# working in Orbe: the project file `project.godot` and the `.godot/` folder, scene and resource
# formats, the GDExtension interface (`godot_*` symbols, `.gdextension`), the `godot` script class
# names and the Android and web export templates' package names. Orbe renames what a person sees
# and what identifies the application: its name, its binary, its application id.

# Left as they are wherever they appear.
keep = [
    # Links: upstream's website, documentation, issues and pull requests, other people's forks.
    "https?://[^\\s)\\]\"'<>`]+",
    # Bare domains and the addresses at them.
    "[\\w.+-]*@?(docs\\.)?godotengine\\.org[\\w./-]*",
    # Upstream's repository, named without a link.
    "godotengine/godot[\\w.-]*",
    # The copyright holders of the code, which the licence requires in every source file and in the
    # notices.
    "Godot Engine contributors",
    # The Android and web export templates keep upstream's package names.
    "org\\.godotengine\\.[a-z][\\w.]*",
    # Identifiers: C++ classes and namespaces, Java and Kotlin classes, the GDExtension interface.
    "\\w+Godot\\w*",
    "Godot\\w+",
    # The C# API's namespace (`using Godot;`, `Godot.Node`) and the class reference's code samples.
    "using Godot\\b",
    "namespace Godot\\b",
    "\\bGodot\\.[A-Za-z]",
    # The editor icon is looked up by the name of its file, which stays until the art is replaced.
    "SNAME\\(\"Godot\"\\)",
    "add_conversion_exception\\(\"Godot\"\\)",
    "saturation_exceptions\\.insert\\(\"Godot\"\\)",
    # The adaptation notices in the code from Bullet and Jolt.
    "Adapted to Godot from",
    # Upstream's version history: the project converter and compatibility notes name the versions
    # whose projects Orbe opens.
    "Godot (?:[0-9]|<[0-9]|>=?\\s?[0-9])\\S*(?: (?:&|and|or|to|->) [0-9]\\S*)?",
]

# Files left alone entirely.
skip = [
    ".github/rebrand.toml",
    "scripts/rebrand.py",
    # Third-party code and its notices.
    "thirdparty/*",
    # The unit tests: some use the engine's name as test data (a string to match against).
    "tests/*",
    "modules/*/tests/*",
    # The licence notices keep upstream's copyright lines, which the licences require.
    "LICENSE.txt",
    "COPYRIGHT.txt",
    "AUTHORS.md",
    "DONORS.md",
    "NOTICE",
    # The original project's own README, kept for reference.
    "docs/upstream-readme.md",
    # Their own scripts and the Android and web export templates, whose class and global names
    # are what exported projects and plug-ins call.
    "platform/android/java/*",
    "platform/web/*",
    "misc/dist/html/*",
    "modules/mono/*",
    "misc/scripts/*",
    "*/detect.py",
    "methods.py",
    "CHANGELOG.md",
    # Orbe's own records, which name upstream's files on purpose.
    "ATTRIBUTION.md",
    "NODALIA_MIGRATION.md",
    "AGENTS.md",
    "CONTRIBUTING.md",
]

# Lines that keep this app's value when `apply --pin-from` rebrands a tree.
[[pin]]
file = "version.py"
pattern = '^website = "[^"]*"'

[[pin]]
file = "version.py"
pattern = '^docs = "[^"]*"'

# Identity: application id, binary, desktop entry.
[[replace]]
from = "org.godotengine.Godot"
to = "dev.danielmiguelt.Orbe"

[[replace]]
from = 'short_name = "godot"'
to = 'short_name = "orbe"'

# The binary: orbe.<platform>.<target>.<arch>. The quotes keep the web runtime's file names, which
# the page templates name, as they are.
[[replace]]
from = '"#bin/godot"'
to = '"#bin/orbe"'

[[replace]]
from = "#bin/godot{"
to = "#bin/orbe{"

[[replace]]
from = "Exec=godot "
to = "Exec=orbe "

[[replace]]
from = "StartupWMClass=Godot"
to = "StartupWMClass=Orbe"

[[replace]]
from = "Godot Engine"
to = "Orbe"

# The editor's colour presets named after the engine's old versions: Orbe calls them Classic.
# Only the quoted and listed spellings, so the project converter's "Godot 3 project" stays.
[[replace]]
from = '"Godot 2"'
to = '"Classic 2"'

[[replace]]
from = '"Godot 3"'
to = '"Classic 3"'

[[replace]]
from = "'Godot 2'"
to = "'Classic 2'"

[[replace]]
from = ",Godot 2,Godot 3,"
to = ",Classic 2,Classic 3,"

[[replace]]
from = ",Godot 2,Custom"
to = ",Classic 2,Custom"

# What a person reads: the name on its own. Contents only; file names stay.
[[replace]]
from = "Godot"
to = "Orbe"
paths = false
