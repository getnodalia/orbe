name: Release Windows

# Builds the Orbe editor for Windows (x64, x86 and arm64), packages each as a per-user MSI
# installer and a portable zip, installs and removes the x64 MSI and starts the portable build on
# a clean runner, and only then attaches the files to a GitHub release.
#
# The files are not signed (no code-signing certificate): Windows SmartScreen warns the first time
# they run ("More info" > "Run anyway"). Set the WINDOWS_CERTIFICATE or AZURE_* secrets that
# packaging/windows/sign.ps1 reads to sign them.
#
# "Release from main" (release-auto.yml) runs this with the tag when a version and its notes
# land on main, and publishes the release once every platform is attached. Run it by hand with
# tag=vX.Y.Z to rebuild a release's files; without a tag it only uploads workflow artifacts.

on:
  # A change to the Windows packaging builds and checks the packages (artifacts only, no release).
  pull_request:
    paths:
      - ".github/workflows/release-windows.yml"
      - "packaging/windows/**"
      - "packaging/env.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the packages to, e.g. v0.1.0 (empty: artifacts only)"
        required: false
        default: ""
  # release-auto.yml, once a version with its notes lands on main.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to attach the packages to"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-2025
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86, arm64]
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      DIST: ${{ github.workspace }}\dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: ver
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(tr -d '[:space:]' < ORBE_VERSION)"
          test -n "$version"
          # A tag must describe the code it is built from.
          if [[ -n "$TAG" && "${TAG#v}" != "$version" ]]; then
            echo "Tag $TAG does not match ORBE_VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release notes are written
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test -s "docs/release-notes/$TAG.md" || { echo "::error::docs/release-notes/$TAG.md is missing or empty"; exit 1; }

      - name: SCons
        # The engine needs SCons 4.4 or newer, and 4.10.1 or newer to find Visual Studio 2026,
        # which the runner image carries: an older SCons does not see MSVC at all and quietly
        # falls back to MinGW, which is not what Orbe ships.
        shell: pwsh
        run: |
          python -m pip install 'scons==4.10.1'
          python -c "import sys; from SCons.Tool.MSCommon import msvc_exists; sys.exit(0 if msvc_exists() else 'SCons does not find the MSVC toolchain')"

      - name: WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2

      - name: Build and package
        shell: pwsh
        env:
          # Optional: without them the packages are left unsigned.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: pwsh packaging/windows/package.ps1 -Arch ${{ matrix.arch }}

      - name: Checksums
        shell: pwsh
        working-directory: dist
        run: |
          Get-ChildItem | Format-Table Name, Length
          $lines = Get-ChildItem -File orbe-* | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content -Encoding ascii SHA256SUMS-windows-${{ matrix.arch }}
          Get-Content SHA256SUMS-windows-${{ matrix.arch }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbe-windows-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  smoke:
    # The x64 files as a user gets them: start the portable build, then install the MSI, start the
    # installed editor and remove it again. The other architectures are built and checked for
    # their PE header (package.ps1) but can't run on this runner.
    needs: build
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: orbe-windows-x64
          path: dist
      - name: Start the portable build, install and remove the MSI
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          Set-Location dist
          foreach ($line in Get-Content SHA256SUMS-windows-x64) {
            $hash, $name = $line -split '\s+', 2
            if ((Get-FileHash -Algorithm SHA256 $name).Hash.ToLower() -ne $hash) { throw "checksum mismatch: $name" }
          }
          Expand-Archive "orbe-$env:VERSION-windows-x64-portable.zip" -DestinationPath portable
          $cli = Get-ChildItem -Recurse portable -Filter orbe.console.exe | Select-Object -First 1
          $out = & $cli.FullName --headless --version
          Write-Output $out
          if ($LASTEXITCODE -ne 0 -or -not $out) { throw "orbe.console.exe --headless --version failed" }
          if (-not (Test-Path (Join-Path $cli.DirectoryName '_sc_'))) { throw 'the portable zip has no _sc_ file' }

          $msi = (Resolve-Path "orbe-$env:VERSION-windows-x64.msi").Path
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Nodalia\Orbe'
          Get-ChildItem $dir | Format-Table Name, Length
          foreach ($f in 'orbe.exe', 'orbe.console.exe', 'LICENSE.txt', 'COPYRIGHT.txt', 'NOTICE') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "the MSI did not install $f" }
          }
          $installed = & (Join-Path $dir 'orbe.console.exe') --headless --version
          Write-Output $installed
          if ($LASTEXITCODE -ne 0 -or -not $installed) { throw 'the installed orbe.console.exe does not start' }
          $p = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', 'uninstall.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $dir) { throw 'uninstalling left the install folder behind' }

  attach:
    # Nothing reaches a release unless the checks above passed.
    needs: [build, smoke]
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/release-notes
      - name: Release notes are written
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test -s "docs/release-notes/$TAG.md" || { echo "::error::docs/release-notes/$TAG.md is missing or empty"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: orbe-windows-*
          merge-multiple: true
          path: dist
      - name: Attach to the release (a draft, created if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --draft --target "$SHA" \
              --title "Orbe ${TAG#v}" --notes-file "docs/release-notes/$TAG.md"
          fi
          gh release upload "$TAG" dist/* --repo "$REPO" --clobber
