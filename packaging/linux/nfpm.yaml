# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
name: orbe
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: devel
priority: optional
maintainer: ${ORBE_MAINTAINER}
vendor: Nodalia
homepage: https://getnodalia.com/orbe
license: MIT
description: |-
  Nodalia's open-source game engine and editor: 2D and 3D scenes and nodes, physics,
  a scripting language, rendering and export, in an editor drawn in the Nodalia Design Language.

# The window system, the GPU and audio are loaded at run time, so they are dependencies or
# recommendations here rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libstdc++6
      - libx11-6
      - libxcursor1
      - libxi6
      - libxinerama1
      - libxkbcommon0
      - libxrandr2
      - libfontconfig1
      - libgl1 | libegl1
    recommends:
      - libwayland-client0
      - libdecor-0-0
      - libvulkan1
      - mesa-vulkan-drivers
      - libpulse0 | pipewire-pulse
      - xdg-desktop-portal
  rpm:
    depends:
      - libX11
      - libXcursor
      - libXi
      - libXinerama
      - libXrandr
      - libxkbcommon
      - fontconfig
      - (libglvnd-glx or libglvnd-egl)
    recommends:
      - libwayland-client
      - libdecor
      - vulkan-loader
      - mesa-vulkan-drivers
      - pulseaudio-libs
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/orbe
    dst: /usr/bin/orbe
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
